spring:
  application:
    name: event-sourcing-playground
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://localhost:5432/${spring.application.name}
    username: postgres
    password: postgres
axon:
  serializer:
    general: JACKSON
  eventhandling:
    processors:
      merchants:
        simulate-failure: false
        dlq:
          enabled: true
logging:
  level:
    root: INFO
    org:
      michal: DEBUG
      jooq:
        tools:
          LoggerListener: DEBUG
